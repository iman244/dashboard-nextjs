# Type-checks and builds on every pull request and on main.
#
# This repository is public, so Actions minutes are free and unmetered; there
# is no reason for this gate not to exist. .githooks/pre-push runs the same
# commands locally for faster feedback, but a hook can be skipped and this
# cannot — this is the gate, the hook is a convenience.
#
# It matters more here than it looks: the server builds this image with barely
# enough memory, so a build that fails does so after taking the front end down
# for several minutes. Failing in CI instead is free.
name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Matches the Dockerfile's node:20.9-alpine, so a dependency that breaks
      # on the version actually deployed fails here rather than on the server.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20.9'
          cache: npm

      # `npm ci` rather than `npm install`, so a lockfile that has drifted out
      # of sync fails here. Note this is stricter than the image build, whose
      # Dockerfile does not copy package-lock.json and runs `npm install` — so
      # server builds re-resolve dependencies and are not reproducible. Worth
      # fixing separately; this at least keeps the lockfile honest.
      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Not blocking, and not an oversight: main carries 33 pre-existing eslint
      # errors. Gating on them would make every pull request red on arrival,
      # which teaches people to ignore CI rather than to read it. The output is
      # here to be read; make this blocking once the backlog is cleared.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      # No NEXT_PUBLIC_* here on purpose: this proves the build compiles, not
      # that it is configured. src/settings.ts has a fallback for every one of
      # them, and the values that reach users are baked in on the server.
      - name: Build
        run: npm run build
