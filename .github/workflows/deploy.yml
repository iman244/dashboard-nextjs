# Deploys the dashboard by running the platform repo's deploy.sh over SSH.
#
# The deployment logic lives in mainreport-platform, not here, so this file
# stays a caller: it hands over the configuration this repository owns and
# names the service. See that repo's README, "Deployment".
#
# There is deliberately no pull_request trigger. The workflow this replaced had
# one, which would have deployed every pull request over production.
#
# Note that deploying this service stops the running container first: a
# `next build` does not fit in the server's spare memory alongside it. The
# front end is down for the length of the build; deploy.sh restores the
# previous container if the build fails.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Per-repository, so it cannot serialise against dashboard-django — deploy.sh
# takes a lock on the server for that. This only collapses a burst of merges
# here into a single deploy of the newest commit.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        env:
          NEXT_PUBLIC_DJANGO_ADDRESS: ${{ secrets.NEXT_PUBLIC_DJANGO_ADDRESS }}
          NEXT_PUBLIC_DJANGO_API_PATH: ${{ secrets.NEXT_PUBLIC_DJANGO_API_PATH }}
          NEXT_PUBLIC_5_160_115_210_ADDRESS: ${{ secrets.NEXT_PUBLIC_5_160_115_210_ADDRESS }}
          NEXT_PUBLIC_5_160_115_210_API_PATH: ${{ secrets.NEXT_PUBLIC_5_160_115_210_API_PATH }}
          NEXT_PUBLIC_AUTHORIZATION_TOKEN_NAME: ${{ secrets.NEXT_PUBLIC_AUTHORIZATION_TOKEN_NAME }}
          NEXT_PUBLIC_ACCESS_TOKEN_KEY: ${{ secrets.NEXT_PUBLIC_ACCESS_TOKEN_KEY }}
          NEXT_PUBLIC_REFRESH_TOKEN_KEY: ${{ secrets.NEXT_PUBLIC_REFRESH_TOKEN_KEY }}
          NEXT_PUBLIC_LOCALE_COOKIE_NAME: ${{ secrets.NEXT_PUBLIC_LOCALE_COOKIE_NAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Forwarded into the remote shell, where deploy.sh writes them into
          # /app/.env. build.sh reads them from there as --build-arg values,
          # which is the only way NEXT_PUBLIC_* reaches the browser bundle.
          envs: NEXT_PUBLIC_DJANGO_ADDRESS,NEXT_PUBLIC_DJANGO_API_PATH,NEXT_PUBLIC_5_160_115_210_ADDRESS,NEXT_PUBLIC_5_160_115_210_API_PATH,NEXT_PUBLIC_AUTHORIZATION_TOKEN_NAME,NEXT_PUBLIC_ACCESS_TOKEN_KEY,NEXT_PUBLIC_REFRESH_TOKEN_KEY,NEXT_PUBLIC_LOCALE_COOKIE_NAME
          # A full `npm install` and `next build` on a two-core VM.
          command_timeout: 40m
          script: /app/deploy.sh nextjs
